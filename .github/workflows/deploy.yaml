name: Deploy

on:
  schedule:
  - cron: '0 1 * * *' # 1AM UTC; 9PM Eastern
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ['ubuntu-latest']
    # bootstrap/ accepts only tokens for this environment, which only main can deploy to.
    environment: gcp
    permissions:
      id-token: write
      contents: read
    env:
      KO_DOCKER_REPO: gcr.io/kontaindotme
      TF_VAR_domain: kontain.me
      TF_VAR_project_id: kontaindotme
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: 'go.mod'
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
    - uses: imjasonh/setup-crane@6da1ae018866400525525ce74ff892880c099987 # v0.5

    # Setup OIDC->SA auth
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      id: auth
      with:
        workload_identity_provider: 'projects/7577580991/locations/global/workloadIdentityPools/gha-pool/providers/gha-provider'
        service_account: 'gha-deployer@kontaindotme.iam.gserviceaccount.com'
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      with:
        project_id: kontaindotme

    - name: Terraform Plan and Apply
      run: |
        terraform init
        terraform plan -input=false -lock=false -out=plan.tmp
        terraform apply -auto-approve -input=false plan.tmp

  # A separate job, so issues: write never shares a job with the GCP credentials.
  report:
    name: Report
    needs: deploy
    if: always() && github.ref == 'refs/heads/main' && (needs.deploy.result == 'failure' || needs.deploy.result == 'success')
    runs-on: ['ubuntu-latest']
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.deploy.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: Deploy is failing
    steps:
    - name: Open, update, or close the failure issue
      run: |
        number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
          --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
        if [ "$RESULT" = failure ]; then
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The deploy workflow failed on main: $RUN_URL"
          fi
        elif [ -n "$number" ]; then
          gh issue close "$number" --comment "Deploy succeeded: $RUN_URL"
        fi
